name: Release Windows desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Install desktop dependencies
        working-directory: DesktopApp
        run: npm install --no-audit --no-fund

      - name: Build signed Windows release
        if: ${{ env.HAS_WINDOWS_CERTIFICATE != '' }}
        working-directory: DesktopApp
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run ui:build; npm run backend:build; npx electron-builder --win --publish always

      - name: Build unsigned Windows release
        if: ${{ env.HAS_WINDOWS_CERTIFICATE == '' }}
        working-directory: DesktopApp
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ui:build; npm run backend:build; npx electron-builder --win --publish always

      - name: Verify release package
        working-directory: DesktopApp
        run: npm run verify:package

      - name: Upload release build backup
        uses: actions/upload-artifact@v4
        with:
          name: MarketMind-AI-Windows-${{ github.ref_name }}
          path: DesktopApp/dist-build/**
          retention-days: 30