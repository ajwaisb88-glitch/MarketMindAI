name: Electron CI (matrix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Matrix build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore electron dist cache
        uses: actions/cache@v4
        with:
          path: DesktopApp/.electron_dist_cache
          key: electron-dist-${{ matrix.os }}-v43.1.0

      - name: Prepopulate electron dist (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ -d DesktopApp/.electron_dist_cache ]; then
            mkdir -p DesktopApp/node_modules/electron/dist
            cp -R DesktopApp/.electron_dist_cache/* DesktopApp/node_modules/electron/dist/ || true
            echo "Copied cached electron dist"
          else
            echo "No cached electron dist found"
          fi

      - name: Prepopulate electron dist (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path DesktopApp/.electron_dist_cache) {
            New-Item -ItemType Directory -Force -Path DesktopApp\node_modules\electron\dist | Out-Null
            Copy-Item -Path DesktopApp\.electron_dist_cache\* -Destination DesktopApp\node_modules\electron\dist -Recurse -Force
            Write-Output 'Copied cached electron dist'
          } else {
            Write-Output 'No cached electron dist found'
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clear electron-builder cache (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Output "Removing electron-builder cache if present: $env:LOCALAPPDATA\electron-builder\Cache"
          if (Test-Path "$env:LOCALAPPDATA\electron-builder\Cache") { Remove-Item -LiteralPath "$env:LOCALAPPDATA\electron-builder\Cache" -Recurse -Force -ErrorAction SilentlyContinue; Write-Output 'Removed existing electron-builder cache' } else { Write-Output 'No electron-builder cache present' }

      - name: Install DesktopApp dependencies
        working-directory: DesktopApp
        run: npm install --no-audit --no-fund

      - name: Setup Python (for backend)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend deps (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: Backend
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn; fi

      - name: Install backend deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: Backend
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { pip install fastapi uvicorn }

      - name: Run backend tests (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: Backend
        run: python -m pytest -q

      - name: Run backend tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: Backend
        run: python -m pytest -q

      - name: Start backend (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: Backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Start backend (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: Backend
        run: |
          $process = Start-Process -FilePath python `
            -ArgumentList '-m','uvicorn','app.main:app','--host','127.0.0.1','--port','8000' `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput "$env:GITHUB_WORKSPACE\backend.log" `
            -RedirectStandardError "$env:GITHUB_WORKSPACE\backend-error.log" `
            -PassThru
          $process.Id | Set-Content "$env:GITHUB_WORKSPACE\backend.pid"
          Write-Output "Started backend process $($process.Id)"
          node ..\tools\smoke_test.js

      - name: Run smoke test (Unix)
        if: matrix.os != 'windows-latest'
        run: node tools/smoke_test.js

      - name: Show backend logs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Output 'Backend output:'
          if (Test-Path backend.log) { Get-Content backend.log } else { Write-Output 'No backend.log found' }
          Write-Output 'Backend error output:'
          if (Test-Path backend-error.log) { Get-Content backend-error.log } else { Write-Output 'No backend-error.log found' }

      - name: Run postinstall helper (verify, Unix)
        if: matrix.os != 'windows-latest'
        working-directory: DesktopApp
        run: |
          node ./scripts/postinstall-electron.js
          echo "List electron dist files:"
          ls -la node_modules/electron/dist || true

      - name: Run postinstall helper (verify, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: DesktopApp
        run: |
          node .\scripts\postinstall-electron.js
          Write-Output 'List electron dist files:'
          Get-ChildItem node_modules\electron\dist -Force -ErrorAction SilentlyContinue

      - name: Save electron dist to cache folder (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p DesktopApp/.electron_dist_cache
          cp -R DesktopApp/node_modules/electron/dist/* DesktopApp/.electron_dist_cache/ || true

      - name: Save electron dist to cache folder (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $source = 'DesktopApp\node_modules\electron\dist'
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path DesktopApp\.electron_dist_cache | Out-Null
            Copy-Item -Path "$source\*" -Destination DesktopApp\.electron_dist_cache -Recurse -Force
            Write-Output 'Saved Electron dist to cache folder'
          } else {
            Write-Output 'Electron dist was not available; skipping cache save'
          }

  package-windows:
    name: Package Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend build dependencies
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Clear electron-builder cache
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\electron-builder\Cache"
          if (Test-Path $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }

      - name: Install DesktopApp dependencies
        working-directory: DesktopApp
        run: npm install --no-audit --no-fund

      - name: Build unsigned Windows installer
        working-directory: DesktopApp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Verify packaged backend and installer
        working-directory: DesktopApp
        run: npm run verify:package

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMind-AI-Windows-${{ github.sha }}
          path: DesktopApp/dist-build/**
          if-no-files-found: error
          retention-days: 14
